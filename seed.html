<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TurnFlow Home — Seed</title>
  <base href="./">
  <style>
    body{font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;padding:24px}
    pre{background:#111;color:#fff;padding:12px;border-radius:8px;white-space:pre-wrap}
    button{padding:.5rem .75rem;border-radius:.5rem;border:1px solid #ddd;background:#111;color:#fff;cursor:pointer}
    label{display:block;margin:.5rem 0 .25rem}
    input{padding:.5rem;border:1px solid #ddd;border-radius:.5rem;width:320px}
  </style>
</head>
<body>
  <h1>Seed a sample property + request</h1>
  <p>Log in first (as the <strong>owner</strong>), then open this page. We'll create one property and one request owned by the current user.</p>

  <div id="who"></div>

  <h3>Values (you can tweak):</h3>
  <label> Address <input id="address" value="4563 N 51 Blvd"></label>
  <label> Unit <input id="unit" value=""></label>
  <label> Nickname <input id="nickname" value="Main house"></label>
  <label> Request Title <input id="title" value="Kitchen faucet leaking"></label>

  <p style="margin-top:12px"><button id="seedBtn">Create property + request</button></p>
  <pre id="out">Ready.</pre>

  <script type="module" src="public/js/pages/seed.js"></script>
</body>
</html>
