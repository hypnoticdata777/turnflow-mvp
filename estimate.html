<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Estimate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script type="module" src="public/js/script.js"></script>
</head>

<body class="bg-gray-100">

  <script type="module" src="public/js/guard-pm-admin.js"></script>

  <div class="flex">

    <div id="sidebar-container"></div>

    <div class="flex-1 p-6">
      <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow">
        
        <div id="projectInfo" class="mb-6 text-gray-700"></div>

        <h2 class="text-2xl font-semibold mb-2">Tasks</h2>
        <div id="taskSummary" class="space-y-4 text-gray-800"></div>

        <div class="mt-6 text-xl font-bold">
          Total Estimate: <span id="finalEstimate" class="text-green-600">$0.00</span>
        </div>

        <button id="downloadPdfBtn" class="mt-6 bg-green-600 text-white px-4 py-2 rounded">
          📄 Download PDF
        </button>

        <a href="dashboard.html" class="ml-3 bg-gray-600 text-white px-4 py-2 rounded">⬅ Back to Dashboard</a>
      </div>
    </div>
  </div>
    
  <script type="module" src="public/js/pages/estimate.js"></script>
</body>
</html>
